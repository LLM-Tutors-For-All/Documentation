<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 220" role="img" aria-labelledby="title desc">
  <title id="title">Slack tutor setup flow</title>
  <desc id="desc">Create a Slack app, enable Socket Mode, add permissions and install it, subscribe to message events, then run the tutor.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1100" height="220" rx="22" fill="#f8fafc"/>
  <text x="42" y="42" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#172033">Slack setup at a glance</text>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <g transform="translate(42 72)">
      <rect width="165" height="95" rx="14" fill="#4a154b"/>
      <text x="83" y="40" font-size="16" font-weight="700" fill="white">1. Create app</text>
      <text x="83" y="64" font-size="13" fill="#f8e9f8">Choose a workspace</text>
    </g>
    <path d="M217 119 H248" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(261 72)">
      <rect width="170" height="95" rx="14" fill="#fae8ff" stroke="#e879f9"/>
      <text x="85" y="40" font-size="16" font-weight="700" fill="#581c57">2. Socket Mode</text>
      <text x="85" y="64" font-size="13" fill="#475569">Create xapp token</text>
    </g>
    <path d="M441 119 H472" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(485 72)">
      <rect width="170" height="95" rx="14" fill="#fae8ff" stroke="#e879f9"/>
      <text x="85" y="40" font-size="16" font-weight="700" fill="#581c57">3. Install</text>
      <text x="85" y="64" font-size="13" fill="#475569">Scopes · xoxb token</text>
    </g>
    <path d="M665 119 H696" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(709 72)">
      <rect width="170" height="95" rx="14" fill="#fae8ff" stroke="#e879f9"/>
      <text x="85" y="40" font-size="16" font-weight="700" fill="#581c57">4. Events</text>
      <text x="85" y="64" font-size="13" fill="#475569">Mentions · DMs · /tutor</text>
    </g>
    <path d="M889 119 H920" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(933 72)">
      <rect width="125" height="95" rx="14" fill="#172033"/>
      <text x="63" y="40" font-size="16" font-weight="700" fill="white">5. Run</text>
      <text x="63" y="64" font-size="13" fill="#cbd5e1">tutor slack</text>
    </g>
  </g>
</svg>
