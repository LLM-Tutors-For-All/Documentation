<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" role="img" aria-labelledby="title desc">
  <title id="title">Discord tutor setup flow</title>
  <desc id="desc">Create a Discord application, configure the bot token and message intent, authorize it with OAuth, then run the tutor.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="220" rx="22" fill="#f8fafc"/>
  <text x="42" y="42" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#172033">Discord setup at a glance</text>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <g transform="translate(42 72)">
      <rect width="180" height="95" rx="14" fill="#5865f2"/>
      <text x="90" y="40" font-size="16" font-weight="700" fill="white">1. Application</text>
      <text x="90" y="64" font-size="13" fill="#eef2ff">Create in Developer Portal</text>
    </g>
    <path d="M232 119 H273" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(286 72)">
      <rect width="180" height="95" rx="14" fill="#e0e7ff" stroke="#a5b4fc"/>
      <text x="90" y="40" font-size="16" font-weight="700" fill="#25316b">2. Bot settings</text>
      <text x="90" y="64" font-size="13" fill="#475569">Token · message intent</text>
    </g>
    <path d="M476 119 H517" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(530 72)">
      <rect width="180" height="95" rx="14" fill="#e0e7ff" stroke="#a5b4fc"/>
      <text x="90" y="40" font-size="16" font-weight="700" fill="#25316b">3. OAuth install</text>
      <text x="90" y="64" font-size="13" fill="#475569">Scopes · permissions</text>
    </g>
    <path d="M720 119 H761" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(774 72)">
      <rect width="144" height="95" rx="14" fill="#172033"/>
      <text x="72" y="40" font-size="16" font-weight="700" fill="white">4. Run</text>
      <text x="72" y="64" font-size="13" fill="#cbd5e1">tutor discord</text>
    </g>
  </g>
</svg>
