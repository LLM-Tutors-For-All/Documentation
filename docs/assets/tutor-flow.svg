<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">LLM tutor request flow</title>
  <desc id="desc">Course files are indexed locally, retrieved for a question, and sent to the tutoring engine before reaching each interface.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#4051b5"/>
      <stop offset="1" stop-color="#7c4dff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="280" rx="22" fill="#f8fafc"/>
  <text x="48" y="48" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033">How the tutor answers</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(45 90)">
      <rect width="170" height="105" rx="14" fill="url(#bg)"/>
      <text x="85" y="45" font-size="17" font-weight="700" fill="white">Data 8 corpus</text>
      <text x="85" y="70" font-size="13" fill="#eef2ff">Lectures - assignments</text>
    </g>
    <path d="M225 142 H292" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(305 90)">
      <rect width="170" height="105" rx="14" fill="#e0e7ff" stroke="#a5b4fc"/>
      <text x="85" y="43" font-size="17" font-weight="700" fill="#24305e">Local retrieval</text>
      <text x="85" y="69" font-size="13" fill="#475569">BM25 - embeddings</text>
    </g>
    <path d="M485 142 H552" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(565 90)">
      <rect width="155" height="105" rx="14" fill="#ede9fe" stroke="#c4b5fd"/>
      <text x="78" y="43" font-size="17" font-weight="700" fill="#3b276a">Tutor engine</text>
      <text x="78" y="69" font-size="13" fill="#475569">OpenAI-compatible</text>
    </g>
    <path d="M730 142 H797" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(810 75)">
      <rect width="110" height="135" rx="14" fill="#172033"/>
      <text x="55" y="38" font-size="15" font-weight="700" fill="white">Interfaces</text>
      <text x="55" y="68" font-size="13" fill="#cbd5e1">Local CLI</text>
      <text x="55" y="91" font-size="13" fill="#cbd5e1">Discord</text>
      <text x="55" y="114" font-size="13" fill="#cbd5e1">Slack</text>
    </g>
  </g>
</svg>
