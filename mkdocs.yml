site_name: LLM Tutors For All
site_description: Exploring the performance and cost tradeoffs of deploying LLM tutors across services.
site_url: https://llm-tutors-for-all.github.io/Documentation/
repo_url: https://github.com/LLM-Tutors-For-All/Documentation
repo_name: LLM-Tutors-For-All/Documentation

theme:
  name: material
  icon:
    logo: material/robot
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

nav:
  - Home: home.md
  - Chat Integrations:
      - Overview: integrations.md
      - Discord: discord.md
      - Slack: slack.md
  - Benchmark: benchmark.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

strict: true
