site_name: LLM Tutors For All
site_description: Exploring the performance and cost tradeoffs of deploying LLM tutors across services.
site_url: https://llm-tutors-for-all.github.io/Documentation/
repo_url: https://github.com/LLM-Tutors-For-All/Documentation
repo_name: LLM-Tutors-For-All/Documentation

theme:
  name: material
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  icon:
    logo: material/robot
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

nav:
  - Home: home.md
  - How to Use Our Bots:
      - Overview: using-bots.md
      - Current Bots:
          - Data 8:
              - Getting Started: getting-started.md
  - Tutor Options:
      - Overview: options.md
      - Local CLI: local-tutor.md
      - Discord: discord.md
      - Slack: slack.md
  - Model Options:
      - Overview: model-options.md
      - Data 8:
          - GPT Corpus: corpus-options.md
          - OpenAI Brain: openai-options.md
  - Benchmark: benchmark.md
  - Contact: contact.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

strict: true
