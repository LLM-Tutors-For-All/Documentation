site_name: LLM Tutors For All
site_description: Exploring the performance and cost tradeoffs of deploying LLM tutors across services.
site_url: https://llm-tutors-for-all.github.io/Documentation/
repo_url: https://github.com/LLM-Tutors-For-All/Documentation
repo_name: LLM-Tutors-For-All/Documentation

theme:
  name: material
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  logo: assets/llm-tfa-logo.png
  favicon: assets/llm-tfa-logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.suggest

nav:
  - Home: home.md
  - How to Use Our Bots:
      - Overview: how-to-use-our-bots/index.md
      - Current Bots:
          - Data 8:
              - Getting Started: how-to-use-our-bots/data8/getting-started.md
  - Tutor Options:
      - Overview: tutor-options/index.md
      - Interfaces:
          - Local CLI: tutor-options/interfaces/local-cli.md
          - Discord: tutor-options/interfaces/discord.md
          - Slack: tutor-options/interfaces/slack.md
  - Model Options:
      - Overview: model-options/index.md
      - Data 8:
          - GPT Corpus: model-options/data8/corpus-options.md
          - OpenAI Brain: model-options/data8/openai-options.md
  - Benchmarks:
      - Overview: benchmark.md
      - How Evaluation Works: benchmark/evaluation.md
  - Contact: contact.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

strict: true
